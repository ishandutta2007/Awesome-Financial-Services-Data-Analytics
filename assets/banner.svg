<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Dynamic Line Chart Animation Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#textGrad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Dynamic stroke pulse animations */
    @keyframes chartPulse {
      0% { stroke-dashoffset: 1000; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1000; }
    }
    
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-15px) scale(1.2); opacity: 0.8; }
      100% { transform: translateY(0px) scale(1); opacity: 0.3; }
    }

    .animated-chart {
      stroke-dasharray: 1000;
      animation: chartPulse 12s linear infinite;
    }

    .particle-1 { animation: floatParticle 4s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 6s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 5s ease-in-out infinite 2s; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Dynamic Grid Lines (Analytics Theme) -->
  <g stroke="#334155" stroke-opacity="0.3" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>

    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Background Dynamic Candlesticks / Bars (Kept in Background behind Text) -->
  <g fill="url(#accentGrad)">
    <rect x="750" y="220" width="24" height="100" rx="4"/>
    <rect x="810" y="180" width="24" height="140" rx="4"/>
    <rect x="870" y="140" width="24" height="180" rx="4"/>
    <rect x="930" y="200" width="24" height="120" rx="4"/>
    <rect x="990" y="100" width="24" height="220" rx="4"/>
    <rect x="1050" y="160" width="24" height="160" rx="4"/>
  </g>

  <!-- Dynamic Glowing Line Chart in Background -->
  <path class="animated-chart" filter="url(#glow)" d="M 650 300 Q 750 250, 850 180 T 1050 120 T 1150 70" fill="none" stroke="#38bdf8" stroke-width="4"/>

  <!-- Glowing Particles -->
  <circle class="particle-1" cx="850" cy="180" r="6" fill="#38bdf8"/>
  <circle class="particle-2" cx="1050" cy="120" r="8" fill="#818cf8"/>
  <circle class="particle-3" cx="1150" cy="70" r="7" fill="#22c55e"/>

  <!-- Foreground Content Block (Guaranteed foreground placement) -->
  <!-- Top Category Pill Badge -->
  <g transform="translate(80, 75)">
    <rect width="320" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="16" y="23" class="badge-text">💹 FINANCIAL DATA &amp; QUANT ANALYTICS</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="175" class="title">Awesome Financial Services Data Analytics</text>

  <!-- Subtitle / Description -->
  <text x="80" y="225" class="subtitle">Curated Commercial Financial Platforms, Market Data Infrastructure</text>
  <text x="80" y="255" class="subtitle">&amp; Open-Source Quantitative Analytics Libraries</text>

  <!-- Footer Stats / Highlights -->
  <g transform="translate(80, 310)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="180" height="40" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155"/>
    <text x="16" y="25" font-family="sans-serif" font-size="14" fill="#38bdf8" font-weight="bold">📈 10+ Commercial SaaS</text>

    <!-- Item 2 -->
    <rect x="200" y="0" width="210" height="40" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155"/>
    <text x="16" y="25" font-family="sans-serif" font-size="14" fill="#22c55e" font-weight="bold">🔓 20+ Open-Source Libs</text>

    <!-- Item 3 -->
    <rect x="430" y="0" width="220" height="40" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155"/>
    <text x="16" y="25" font-family="sans-serif" font-size="14" fill="#c084fc" font-weight="bold">🧮 Quantitative &amp; Risk Tools</text>
  </g>
</svg>
